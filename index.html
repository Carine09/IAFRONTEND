<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio Lumen · Photographe</title>
  <meta name="description" content="Studio Lumen, photographe de portraits et de mariages en Île-de-France.">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="components/button.css">
</head>
<body>
  <a class="skip-link" href="#contenu">Aller au contenu</a>

  <header class="site-header">
    <p class="logo">Studio Lumen</p>
    <nav aria-label="Navigation principale">
      <ul class="nav-list">
        <li><a href="index.html" aria-current="page">Accueil</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="contenu">
    <section class="hero">
      <h1>La lumière juste, au bon moment</h1>
      <p>Portraits, mariages et reportages, en studio ou en extérieur.</p>
      <a class="button" href="contact.html">Prendre rendez-vous</a>
    </section>

    <section class="gallery" aria-labelledby="titre-galerie">
      <h2 id="titre-galerie">Derniers projets</h2>
      <ul class="gallery-list">
        <li class="gallery-item">
          <div class="gallery-visual gallery-visual--1" role="img" aria-label="Aperçu de la série Portraits d’atelier"></div>
          <p>Portraits d’atelier</p>
        </li>
        <li class="gallery-item">
          <div class="gallery-visual gallery-visual--2" role="img" aria-label="Aperçu de la série Mariage en bord de Seine"></div>
          <p>Mariage en bord de Seine</p>
        </li>
        <li class="gallery-item">
          <div class="gallery-visual gallery-visual--3" role="img" aria-label="Aperçu de la série Reportage au marché"></div>
          <p>Reportage au marché</p>
        </li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 Studio Lumen</p>
  </footer>
</body>
</html>
